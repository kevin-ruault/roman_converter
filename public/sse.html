<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Convertisseur SSE en direct</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <h1>Convertisseur SSE (0-100)</h1>

    <div>
      <input
        type="number"
        id="sseNumberInput"
        min="0"
        max="100"
        placeholder="Entrez un nombre"
      />
      <p class="converted-result">Résultat : <span id="sseResult"></span></p>
    </div>

    <script src="script-sse.js"></script>
  </body>
</html>
