<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Conversion en chiffres romains</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <h1>Convertisseur en chiffres romains</h1>

    <div>
      <input
        type="number"
        id="numberInput"
        min="0"
        max="100"
        placeholder="Entrez un nombre"
      />
      <button id="convertBtn">Convertir</button>
    </div>

    <p class="converted-result">Résultat : <span id="result"></span></p>

    <script src="script.js"></script>
  </body>
</html>
